
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Generator stylu</title>
    <script src="script.js" defer></script>
</head>
<body>
    <p id="text">Przykładowy tekst</p>

    <label for="input">Wpisz tekst:</label>
    <input type="text" id="input">

    <label for="range">Rozmiar czcionki:</label>
    <input type="range" id="range" min="12" max="40" value="24">

    <h3>Kolor tekstu</h3>
    <button id="red">Czerwony</button>
    <button id="green">Zielony</button>
    <button id="blue">Niebieski</button>

    <h3>Kolor tła</h3>
    <button id="yellow-bg">Żółte</button>
    <button id="green-bg">Zielone</button>

    <h3>Reset</h3>
    <button id="reset">Resetuj wszystko</button>
</body>
</html>
