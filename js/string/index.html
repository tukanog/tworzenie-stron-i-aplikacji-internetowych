<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ćwiczenia</title>
    <script src="cwiczenia.js" defer></script>
</head>
<body>
    <h2>Czyszczenie danych wejściowych</h2>
    <div id="czyszczenie-danych-wejsciowych">
        <form id="form_zad01">
            Nazwa użytkownika: <input type="text" id="nazwa-uzytkownika">
        <button>Wyślij</button>
        </form> 
    </div>

    <h2>Inicjały i ekstrakcja</h2>
    <div id="inicjaly-i-ekstrakcja">
        <form id="form_zad02">
            Imię i nazwisko: <input type="text" id="imie-i-nazwisko">
        <button>Wyślij</button>
        </form>
    </div>

    <h2>Walidator domeny</h2>
    <div id="walidator-domeny">
        <form id="form_zad03">
            Adres URL: <input type="text" id="url">
        <button>Wyślij</button>
        </form>
    </div>

    <h2>Omijanie niemutowalności</h2>
    <div id="omijanie-niemutowalnosci">
        <p id="string">JavaScript</p>
        <button id="zamien">Zamień</button>
    </div>

    <h2>Parser listy zakupów</h2>
    <div id="parser-listy-zakupów">
        <p id="array">Chleb,Mleko,Jajka,Masło</p>
        <button id="policz">Ile?</button>
    </div>
</body>
</html>
