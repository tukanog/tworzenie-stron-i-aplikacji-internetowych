<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="script.js"></script>
</head>
<body>
    <h1>Formatowanie tekstu</h1>
    <p id="text">Lorem ipsum dolor sit amet.</p>
    <div>
        <div>
            Rozmiar tekstu: <input type="range" id="range" min="1" max="32" value="16">px
        </div>
        <div>
            <input type="checkbox" class="biu" value="font-weight: bold"> pogrubienie
            <input type="checkbox" class="biu" value="font-style: italic"> kursywa
            <input type="checkbox" class="biu" value="text-decoration: underline"> podkreślenie
        </div>
        <div>
            <input type="text" id="input" placeholder="Wpisz coś">
        </div>
    </div>
</body>
</html>
