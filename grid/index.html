<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Grid - Układ strony.</title>
</head>
<body>
    <h1>Grid Układ Strony!</h1>
    <div id="simple" class="grid">
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
    </div>

    <h2>Siatka układu strony</h2>
    <div class="grid" id="area">
        <header>header</header>
        <nav>menu</nav>
        <aside>aside</aside>
        <main>main</main>
        <footer>footer</footer> 
        <sidenav>sidenav</sidenav> 
    </div>
</body>
</html>
